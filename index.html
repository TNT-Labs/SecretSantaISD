<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1f">
<meta name="description" content="Secret Santa ISD — pranzo di Natale dell'11 dicembre.">
<title>Secret Santa ISD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700;1,900&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #070b1f;
  --bg2: #101a4a;
  --fg: #f4f6ff;
  --muted: #a9b2d6;
  --gold: #ffd77a;
  --gold2: #e8a93a;
  --red: #e8324f;
  --red2: #a3122d;
  --green: #2fd59a;
  --ice: #bfe6ff;
  --glass: rgba(255, 255, 255, .065);
  --glass-2: rgba(255, 255, 255, .11);
  --line: rgba(255, 255, 255, .14);
  --radius: 18px;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --font: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; min-height: 100dvh; }
body {
  background:
    radial-gradient(1200px 700px at 80% -10%, #1d2f7a 0%, transparent 60%),
    radial-gradient(900px 600px at 0% 10%, #3a1550 0%, transparent 55%),
    linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 70%);
  background-color: var(--bg1);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.45;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Background layers ---------- */
#sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { z-index: 0; }
#fx { z-index: 60; }
.aurora { position: fixed; inset: -20% -10% auto -10%; height: 70vh; z-index: 0; pointer-events: none; filter: blur(60px); opacity: .55; }
.aurora i { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 22s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 55vw; height: 30vh; left: 5%; top: 20%; background: radial-gradient(closest-side, rgba(47, 213, 154, .55), transparent); }
.aurora i:nth-child(2) { width: 45vw; height: 26vh; left: 45%; top: 10%; background: radial-gradient(closest-side, rgba(80, 140, 255, .55), transparent); animation-duration: 28s; animation-delay: -6s; }
.aurora i:nth-child(3) { width: 40vw; height: 24vh; left: 25%; top: 35%; background: radial-gradient(closest-side, rgba(220, 70, 200, .4), transparent); animation-duration: 34s; animation-delay: -12s; }
@keyframes drift {
  0% { transform: translate3d(-6%, 0, 0) scale(1) rotate(-4deg); }
  100% { transform: translate3d(8%, 6%, 0) scale(1.2) rotate(5deg); }
}
.hills { position: fixed; left: 0; right: 0; bottom: 0; height: 22vh; min-height: 110px; z-index: 0; pointer-events: none; }
.hills svg { width: 100%; height: 100%; display: block; }

/* ---------- Layout ---------- */
.shell { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; }
header.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(7, 11, 31, .85), rgba(7, 11, 31, .35) 80%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; min-height: 44px; font-weight: 700; letter-spacing: .02em; }
.brand-badge { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: linear-gradient(145deg, var(--red), var(--red2)); box-shadow: 0 6px 18px rgba(232, 50, 79, .45), inset 0 1px 0 rgba(255, 255, 255, .3); }
.brand b { font-family: var(--serif); font-style: italic; font-weight: 900; color: var(--gold); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn[hidden] { display: none; }
.icon-btn.pulse { animation: musicPulse 1.6s ease-in-out infinite; border-color: rgba(255, 215, 122, .7); }
@keyframes musicPulse { 50% { box-shadow: 0 0 0 6px rgba(255, 215, 122, .18), 0 0 24px rgba(255, 215, 122, .45); transform: scale(1.06); } }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; font-size: 19px; transition: background .2s, transform .2s; }
@media (hover: hover) { .icon-btn:hover { background: var(--glass-2); transform: translateY(-1px); } }
main#app { flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right)) calc(140px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

/* ---------- Typography ---------- */
.eyebrow { margin: 0; text-transform: uppercase; letter-spacing: .32em; font-size: .78rem; color: var(--ice); font-weight: 600; opacity: .9; }
.title { font-family: var(--serif); font-style: italic; font-weight: 900; line-height: .95; margin: 12px 0 10px; font-size: clamp(3.1rem, 12vw, 7.2rem); letter-spacing: -.01em; }
.shine {
  background: linear-gradient(100deg, #fff3c9 0%, var(--gold) 25%, #fff8e0 40%, var(--gold2) 55%, var(--gold) 75%, #fff3c9 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shine 6s linear infinite;
  filter: drop-shadow(0 4px 24px rgba(255, 200, 90, .35));
}
@keyframes shine { to { background-position: -250% 0; } }
.subtitle { margin: 0; color: var(--muted); font-size: clamp(1rem, 3.6vw, 1.25rem); }
.subtitle strong { color: var(--fg); font-weight: 600; }
h2.section { font-family: var(--serif); font-style: italic; font-size: clamp(1.9rem, 6vw, 2.8rem); margin: 8px 0 4px; }
.lead { margin: 0 0 18px; color: var(--muted); }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--glass); font-weight: 600; letter-spacing: .01em; text-decoration: none;
  transition: transform .2s, box-shadow .2s, background .2s, opacity .2s;
}
@media (hover: hover) { .btn:not(:disabled):hover { transform: translateY(-2px); background: var(--glass-2); } }
.btn:not(:disabled):active { transform: translateY(1px) scale(.98); }
.btn:disabled { opacity: .45; }
.btn.primary {
  border: 0; color: #2a1600;
  background: linear-gradient(135deg, #fff0b8, var(--gold) 35%, var(--gold2));
  box-shadow: 0 10px 30px rgba(232, 169, 58, .45), inset 0 1px 0 rgba(255, 255, 255, .7);
}
@media (hover: hover) { .btn.primary:not(:disabled):hover { background: linear-gradient(135deg, #fff6d0, #ffe08f 35%, #f0b54a); box-shadow: 0 14px 38px rgba(232, 169, 58, .6), inset 0 1px 0 rgba(255, 255, 255, .7); } }
.btn.red { border: 0; color: #fff; background: linear-gradient(135deg, #ff6a80, var(--red) 45%, var(--red2)); box-shadow: 0 10px 30px rgba(232, 50, 79, .45), inset 0 1px 0 rgba(255, 255, 255, .35); }
.btn.big { min-height: 60px; padding: 16px 32px; font-size: 1.15rem; }
.btn.small { min-height: 44px; padding: 8px 16px; font-size: .95rem; }
.btn.danger { color: #ffb3c0; border-color: rgba(255, 120, 140, .35); }

/* ---------- Cards ---------- */
.card {
  position: relative; background: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
  border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.card h3 { margin: 0 0 4px; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
.card .hint { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
.count-pill { font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(255, 215, 122, .16); color: var(--gold); }
.row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  padding: 4px 4px 4px 14px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line);
  animation: pop .35s cubic-bezier(.2, 1.6, .4, 1) both;
}
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; margin-left: -4px; box-shadow: 0 0 10px currentColor; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; margin-top: 14px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; margin-bottom: 16px; background: rgba(255, 215, 122, .1); border: 1px solid rgba(255, 215, 122, .35); color: #ffe7b0; }

/* ---------- Home hero ---------- */
.hero { text-align: center; padding: 18px 0 10px; display: flex; flex-direction: column; align-items: center; }
.hero-gift { margin: 24px 0 10px; }
.countdown { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(520px, 100%); margin: 18px 0 26px; }
.cd-tile { padding: 14px 6px 10px; border-radius: 16px; background: linear-gradient(160deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03)); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.cd-tile b { display: block; font-size: clamp(1.7rem, 7vw, 2.6rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; background: linear-gradient(180deg, #fff, var(--ice)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cd-tile small { display: block; margin-top: 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .18em; color: var(--muted); }
.cd-done { display: none; font-family: var(--serif); font-style: italic; font-size: 1.8rem; color: var(--gold); margin: 18px 0 26px; }
.cd-wrap.done .countdown { display: none; }
.cd-wrap.done .cd-done { display: block; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ---------- Gift box ---------- */
.gift { --g: 200px; position: relative; width: var(--g); height: var(--g); padding: 0; border: 0; background: none; display: block; }
.gift.bob { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
.gift::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: -8%; height: 10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); z-index: -1; }
.gift-glow { position: absolute; inset: -25%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 200, 100, .35), transparent 70%); animation: pulse 2.6s ease-in-out infinite; pointer-events: none; }
@keyframes pulse { 50% { transform: scale(1.12); opacity: .6; } }
.gift-body {
  position: absolute; left: 8%; right: 8%; bottom: 0; height: 60%; border-radius: calc(var(--g) * .05);
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .22) 0 calc(var(--g) * .012), transparent calc(var(--g) * .016)) 0 0 / calc(var(--g) * .13) calc(var(--g) * .13),
    linear-gradient(160deg, #ff6075, #d21f40 55%, #8e0f28);
  box-shadow: inset calc(var(--g) * -.06) calc(var(--g) * -.07) calc(var(--g) * .12) rgba(0, 0, 0, .28), inset calc(var(--g) * .04) calc(var(--g) * .04) calc(var(--g) * .08) rgba(255, 255, 255, .14);
}
.gift-body::before, .gift-lid::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 17%; transform: translateX(-50%); background: linear-gradient(90deg, #b9781a, #ffe7a6 45%, #f5c55a 60%, #b9781a); box-shadow: 0 0 12px rgba(255, 215, 122, .35); }
.gift-lid {
  position: absolute; left: 2%; right: 2%; top: 26%; height: 18%; z-index: 2; border-radius: calc(var(--g) * .04);
  background: linear-gradient(160deg, #ff7486, #d82848 60%, #9a1230);
  box-shadow: 0 calc(var(--g) * .03) calc(var(--g) * .05) rgba(0, 0, 0, .35), inset 0 2px 0 rgba(255, 255, 255, .25);
  transform-origin: 50% 100%;
}
.bow { position: absolute; left: 50%; bottom: 88%; width: 62%; height: 70%; transform: translateX(-50%); }
.bow::before, .bow::after {
  content: ''; position: absolute; bottom: 4%; width: 46%; height: 72%;
  border: calc(var(--g) * .042) solid #f7c95a; border-radius: 50% 50% 46% 46%;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), 0 4px 10px rgba(0, 0, 0, .25);
}
.bow::before { left: 3%; transform: rotate(-34deg); transform-origin: 100% 100%; }
.bow::after { right: 3%; transform: rotate(34deg); transform-origin: 0 100%; }
.bow i { position: absolute; left: 50%; bottom: -6%; width: 26%; height: 30%; transform: translateX(-50%); border-radius: 40%; background: radial-gradient(circle at 35% 30%, #fff2c4, #f2bd4a 55%, #b9781a); z-index: 1; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); }
.gift.shake { animation: shake .75s cubic-bezier(.36, .07, .19, .97) both; }
@keyframes shake {
  10%, 90% { transform: translateX(-2px) rotate(-2deg); }
  20%, 80% { transform: translateX(4px) rotate(4deg) scale(1.02); }
  30%, 50%, 70% { transform: translateX(-8px) rotate(-7deg) scale(1.05); }
  40%, 60% { transform: translateX(8px) rotate(7deg) scale(1.05); }
}
.gift.open .gift-lid { animation: lidOff .9s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes lidOff {
  0% { transform: translateY(0) rotate(0); }
  35% { transform: translateY(-110%) rotate(-12deg); }
  100% { transform: translate(-70%, -520%) rotate(-70deg); opacity: 0; }
}
.gift.open .gift-body { animation: bodyAway .9s .35s ease-in forwards; }
@keyframes bodyAway { to { transform: translateY(30%) scale(.7); opacity: 0; } }
.gift.open .gift-glow { animation: none; opacity: 0; transition: opacity .4s; }

@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.95); } }
@keyframes swing { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.actions-foot { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 26px; }


/* ---------- Note / status ---------- */
.note-card { margin: 4px 0 0; max-width: 520px; padding: 14px 18px; border-radius: 16px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); color: var(--muted); }
.note-card strong { color: var(--fg); }
.errs { margin: 12px 0 0; padding-left: 20px; color: #ffc0ca; font-size: .92rem; }
.chip .grp { font-size: .72rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(255, 255, 255, .12); color: var(--muted); }
.chip { padding: 6px 14px; }


/* ---------- Inputs ---------- */
.input {
  width: 100%; min-width: 0; min-height: 52px; padding: 12px 16px; border-radius: 14px;
  border: 1px solid var(--line); background: rgba(5, 8, 25, .55); outline: none; font-size: 1.05rem;
  transition: border-color .2s, box-shadow .2s;
}
.input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 215, 122, .18); }
.input::placeholder { color: #7f88b0; }
.login { width: min(440px, 100%); margin: 6vh auto 0; text-align: center; }
.login form { display: grid; gap: 12px; margin-top: 8px; }
.login .emoji { font-size: 46px; line-height: 1; }
.login.err { animation: nope .45s ease both; }
@keyframes nope { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
code.hash { display: block; margin-top: 10px; padding: 12px; border-radius: 12px; background: rgba(0, 0, 0, .4); border: 1px solid var(--line); font: .82rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; text-align: left; color: #dfe6ff; }

/* ---------- Ornament grid (scoperta) ---------- */
.progress { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
.progress .bar { flex: 1; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; border: 1px solid var(--line); }
.progress .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), var(--gold)); box-shadow: 0 0 16px rgba(47, 213, 154, .6); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.progress b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.orn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
@media (max-width: 420px) { .orn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.orn {
  --c1: #ff6075; --c2: #b0142f;
  position: relative; min-width: 0; padding: 46px 12px 16px; border-radius: 20px; border: 1px solid var(--line);
  background: linear-gradient(170deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .025));
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  transition: transform .3s cubic-bezier(.2, 1.4, .4, 1), box-shadow .3s, border-color .3s;
  animation: rise .5s cubic-bezier(.2, .9, .3, 1) both; animation-delay: calc(var(--i, 0) * 40ms);
  margin-top: 22px;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.95); } }
@media (hover: hover) { .orn:hover { transform: translateY(-6px) rotate(-1deg); border-color: rgba(255, 215, 122, .55); box-shadow: 0 18px 40px rgba(0, 0, 0, .4), 0 0 40px rgba(255, 215, 122, .15); } }
.orn .bauble {
  position: absolute; top: -26px; left: 50%; width: 58px; height: 58px; margin-left: -29px; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .95) 0 6%, transparent 18%), radial-gradient(circle at 40% 35%, var(--c1), var(--c2) 75%);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .45), 0 0 26px color-mix(in srgb, var(--c1) 45%, transparent);
  transform-origin: 50% -14px; animation: swing 3.6s ease-in-out infinite; animation-delay: calc(var(--i, 0) * -370ms);
}
.orn .bauble::before { content: ''; position: absolute; top: -9px; left: 50%; width: 16px; height: 10px; margin-left: -8px; border-radius: 3px; background: linear-gradient(90deg, #a77a26, #ffe39a, #a77a26); }
.orn .bauble::after { content: ''; position: absolute; left: 12%; right: 12%; top: 46%; height: 9%; border-radius: 4px; background: rgba(255, 255, 255, .28); }
@keyframes swing { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.orn-name { font-weight: 700; font-size: 1.08rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orn-state { font-size: .8rem; color: var(--muted); }
.orn.seen { opacity: .62; }
.orn.seen .bauble { filter: saturate(.35) brightness(.9); animation-play-state: paused; }
.orn.seen .orn-state { color: var(--green); font-weight: 600; }
.c1 { --c1: #ff6075; --c2: #a3122d; } .c2 { --c1: #ffd77a; --c2: #b97a14; } .c3 { --c1: #4be3ad; --c2: #0d7a54; }
.c4 { --c1: #78b5ff; --c2: #1d4fb0; } .c5 { --c1: #d68cff; --c2: #6a2aa8; } .c6 { --c1: #e6f3ff; --c2: #7f9bbd; }

/* ---------- Overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow-y: auto; overflow-x: hidden;
  padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  background: radial-gradient(800px 600px at 50% 40%, rgba(30, 40, 110, .55), rgba(3, 5, 16, .92));
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  animation: fadeIn .3s ease both;
}
.overlay.closing { animation: fadeOut .25s ease both; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
.dialog { width: min(440px, 100%); padding: 26px; text-align: center; animation: pop .4s cubic-bezier(.2, 1.4, .4, 1) both; }
.dialog h3 { justify-content: center; font-size: 1.35rem; margin-bottom: 8px; }
.dialog p { color: var(--muted); margin: 0 0 20px; }
.dialog .row { justify-content: center; }
.dialog .emoji { font-size: 44px; line-height: 1; margin-bottom: 8px; }

.reveal { width: min(520px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.reveal .hello { font-family: var(--serif); font-style: italic; font-size: clamp(1.8rem, 7vw, 2.6rem); margin: 0; line-height: 1.1; overflow-wrap: anywhere; }
.reveal .tap { color: var(--muted); margin: 0; min-height: 1.5em; transition: opacity .3s; }

.stage > * { grid-area: 1 / 1; }
.stage .gift { --g: min(230px, 58vw); cursor: pointer; }
.stage .gift:disabled { cursor: default; }
.rays {
  position: absolute; left: 50%; top: 50%; width: min(560px, 130vw); aspect-ratio: 1; margin: calc(min(560px, 130vw) / -2) 0 0 calc(min(560px, 130vw) / -2);
  border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(.4);
  background: repeating-conic-gradient(from 0deg, rgba(255, 226, 150, .38) 0deg 7deg, transparent 7deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 12%, transparent 66%); mask: radial-gradient(circle, #000 12%, transparent 66%);
  transition: opacity .6s ease, transform .9s cubic-bezier(.2, .9, .2, 1);
}
.stage.opened .rays { opacity: 1; transform: scale(1); animation: spin 18s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.prize { opacity: 0; transform: scale(.4) translateY(30px); pointer-events: none; transition: opacity .5s ease, transform .8s cubic-bezier(.2, 1.5, .4, 1); display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 100%; padding: 0 8px; }
.stage.revealed .prize { opacity: 1; transform: none; pointer-events: auto; }
.prize .lbl { text-transform: uppercase; letter-spacing: .28em; font-size: .78rem; color: var(--ice); }
.prize .name {
  font-family: var(--serif); font-style: italic; font-weight: 900; font-size: clamp(2.6rem, 13vw, 4.6rem); line-height: 1.05;
  max-width: 100%; overflow-wrap: anywhere; margin: 4px 0;
}
.prize .star { font-size: 2.2rem; animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(1.25) rotate(18deg); filter: drop-shadow(0 0 14px rgba(255, 215, 122, .9)); } }
.after { display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .5s; pointer-events: none; }
.after.show { opacity: 1; transform: none; pointer-events: auto; }
.info-pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.info-pills span { padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font-size: .92rem; }

/* Draw animation */
.draw-scene { position: relative; width: min(560px, 92vw); aspect-ratio: 1; display: grid; place-items: center; }
.orbit { position: absolute; inset: 0; animation: orbitSpin var(--dur, 3s) cubic-bezier(.55, 0, .2, 1) forwards; }
.orbit .slot { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.orbit .nm {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap; max-width: 34vw; overflow: hidden; text-overflow: ellipsis;
  padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: var(--fs, .95rem);
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .25); box-shadow: 0 0 18px rgba(255, 215, 122, .25);
  animation: orbitCounter var(--dur, 3s) cubic-bezier(.55, 0, .2, 1) forwards;
}
@keyframes orbitSpin { from { transform: rotate(0); } to { transform: rotate(1440deg) scale(.15); opacity: 0; } }
@keyframes orbitCounter { from { rotate: 0deg; } to { rotate: -1440deg; } }
.core { width: 34%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: clamp(42px, 12vw, 72px);
  background: radial-gradient(circle at 35% 30%, #fff8e0, var(--gold) 35%, var(--gold2) 70%, #8a5a10);
  box-shadow: 0 0 60px rgba(255, 215, 122, .7), 0 0 140px rgba(255, 180, 60, .45);
  animation: corePulse .6s ease-in-out infinite alternate, coreBoom var(--dur, 3s) ease-in forwards; }
@keyframes corePulse { to { box-shadow: 0 0 90px rgba(255, 215, 122, .95), 0 0 200px rgba(255, 180, 60, .6); } }
@keyframes coreBoom { 0%, 80% { transform: scale(1); } 92% { transform: scale(1.35); } 100% { transform: scale(.2); opacity: 0; } }
.draw-caption { position: absolute; bottom: -10px; left: 0; right: 0; text-align: center; font-family: var(--serif); font-style: italic; font-size: 1.5rem; color: var(--gold); }
.flash { position: fixed; inset: 0; background: radial-gradient(circle, #fff, rgba(255, 230, 170, .6) 40%, transparent 75%); pointer-events: none; z-index: 55; animation: flash .7s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }

/* Toast */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 70; transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
  padding: 12px 20px; border-radius: 999px; background: rgba(12, 18, 48, .92); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 600; max-width: calc(100vw - 32px); text-align: center; transition: opacity .3s, transform .35s cubic-bezier(.2, 1.4, .4, 1); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { border-color: rgba(255, 110, 130, .6); color: #ffc6cf; }

.footer-note { text-align: center; color: #6f78a0; font-size: .8rem; margin-top: 28px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

<script>
'use strict';
(() => {
  // ============ Config & utilities ============
  const CONFIG_URL = 'config.json';
  const CSV_URL = 'partecipanti.csv';
  const DRAW_KEY = 'ssisd.draw.v3';
  const AUTH_KEY = 'ssisd.auth';
  const PREFS_KEY = 'ssisd.prefs';
  const MAX_NAME = 40;
  const MIN_PEOPLE = 3;
  const DEFAULT_CONFIG = Object.freeze({
    titolo: 'Pranzo di Natale ISD',
    dataEvento: '2026-12-11T13:00:00+01:00',
    budget: '',
    passwordHash: '',
    musica: ''
  });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS = ['#ff6075', '#ffd77a', '#4be3ad', '#78b5ff', '#d68cff', '#e6f3ff'];

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? Math.min(ms, 60) : ms));
  const normalizeName = (s) => String(s ?? '').replace(/\s+/g, ' ').trim().slice(0, MAX_NAME);
  const nameKey = (s) => normalizeName(s).toLocaleLowerCase('it');

  const store = {
    load(k, d, area = 'localStorage') { try { const v = JSON.parse(window[area].getItem(k)); return v ?? d; } catch { return d; } },
    save(k, v, area = 'localStorage') { try { window[area].setItem(k, JSON.stringify(v)); } catch { /* storage non disponibile */ } },
    del(k, area = 'localStorage') { try { window[area].removeItem(k); } catch { /* ignore */ } }
  };

  // ============ Pure logic: CSV ============
  function parseCSVRows(text) {
    text = String(text).replace(/^﻿/, '');
    const first = text.split(/\r?\n/, 1)[0] || '';
    const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  /** CSV → { people: [{name, group}], errors: [] }. Colonne: nome[, gruppo]. */
  function participantsFromCSV(text) {
    const rows = parseCSVRows(text).map((r) => r.map((c) => c.trim()));
    const errors = [];
    let nameCol = 0, groupCol = 1, start = 0;
    const header = (rows[0] || []).map((c) => c.toLowerCase());
    if (['nome', 'name', 'partecipante', 'nominativo'].includes(header[0]) || header.includes('nome')) {
      nameCol = Math.max(0, header.findIndex((c) => ['nome', 'name', 'partecipante', 'nominativo'].includes(c)));
      groupCol = header.findIndex((c) => ['gruppo', 'group', 'coppia'].includes(c));
      start = 1;
    }
    const people = [], seen = new Set();
    for (let i = start; i < rows.length; i++) {
      const r = rows[i];
      if (!r.length || r.every((c) => !c) || (r[0] || '').startsWith('#')) continue;
      const raw = r[nameCol] || '';
      const name = normalizeName(raw);
      if (!name) { errors.push(`Riga ${i + 1}: nome mancante`); continue; }
      if (raw.trim().length > MAX_NAME) errors.push(`Riga ${i + 1}: nome troppo lungo, accorciato a "${name}"`);
      const k = nameKey(name);
      if (seen.has(k)) { errors.push(`Riga ${i + 1}: "${name}" è duplicato, ignorato`); continue; }
      seen.add(k);
      people.push({ name, group: groupCol >= 0 ? normalizeName(r[groupCol] || '') : '' });
    }
    return { people, errors };
  }

  function exclusionsFromGroups(people) {
    const ex = [];
    for (let i = 0; i < people.length; i++)
      for (let j = i + 1; j < people.length; j++)
        if (people[i].group && nameKey(people[i].group) === nameKey(people[j].group)) ex.push([people[i].name, people[j].name]);
    return ex;
  }

  // ============ Pure logic: draw ============
  function shuffle(arr, rng = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function isValidAssignment(map, ids) {
    if (!map || typeof map !== 'object') return false;
    const keys = Object.keys(map);
    if (keys.length !== ids.length) return false;
    const set = new Set(ids), recv = new Set();
    for (const g of keys) {
      const r = map[g];
      if (typeof r !== 'string' || !set.has(g) || !set.has(r) || g === r || recv.has(r)) return false;
      recv.add(r);
    }
    return true;
  }

  function makeAllowed(exclusions) {
    const banned = new Set();
    for (const [a, b] of exclusions) { banned.add(a + '\u0000' + b); banned.add(b + '\u0000' + a); }
    return (g, r) => g !== r && !banned.has(g + '\u0000' + r);
  }

  function blockedGivers(ids, exclusions) {
    const ok = makeAllowed(exclusions);
    return ids.filter((g) => !ids.some((r) => ok(g, r)));
  }

  /** Backtracking randomizzato con euristica MRV; ritorna {persona: chi le fa il regalo} o null. */
  function solve(ids, ok, noMutual, rng) {
    const options = (g) => ids.filter((r) => ok(g, r)).length;
    const givers = shuffle(ids, rng).sort((a, b) => options(a) - options(b));
    const used = new Set(), out = new Map();
    let steps = 0;
    const LIMIT = 40000;
    function bt(i) {
      if (i === givers.length) return true;
      if (++steps > LIMIT) return false;
      const g = givers[i];
      for (const r of shuffle(ids, rng)) {
        if (used.has(r) || !ok(g, r)) continue;
        if (noMutual && out.get(r) === g) continue;
        used.add(r); out.set(g, r);
        if (bt(i + 1)) return true;
        used.delete(r); out.delete(g);
      }
      return false;
    }
    return bt(0) ? Object.assign(Object.create(null), Object.fromEntries(out)) : null;
  }

  function computeDraw(ids, exclusions, rng = Math.random) {
    if (ids.length < 2) return null;
    const ok = makeAllowed(exclusions);
    // Prima prova senza scambi reciproci (A→B e B→A), poi accetta qualsiasi soluzione valida.
    for (const noMutual of ids.length > 2 ? [true, false] : [false]) {
      for (let attempt = 0; attempt < 25; attempt++) {
        const res = solve(ids, ok, noMutual, rng);
        if (res) return res;
      }
    }
    return null;
  }

  // ============ Config pubblicata ============
  const validDate = (s) => typeof s === 'string' && s.trim() !== '' && !isNaN(new Date(s));
  const isHash = (h) => typeof h === 'string' && /^[0-9a-f]{64}$/.test(h);
  function sanitizeConfig(raw) {
    const c = { ...DEFAULT_CONFIG };
    if (!raw || typeof raw !== 'object') return c;
    if (typeof raw.titolo === 'string' && raw.titolo.trim()) c.titolo = raw.titolo.trim().slice(0, 60);
    if (validDate(raw.dataEvento)) c.dataEvento = raw.dataEvento;
    c.budget = typeof raw.budget === 'string' ? raw.budget.trim().slice(0, 40) : '';
    // Solo un file del sito (es. "musica.mp3" o "audio/brano.mp3") o un indirizzo https.
    const m = typeof raw.musica === 'string' ? raw.musica.trim() : '';
    c.musica = /^(https:\/\/[^\s"'<>]+|(?!.*\.\.)[^\s:"'<>\\/][^:"'<>\\]*\.(mp3|m4a|aac|ogg|oga|opus|wav))$/i.test(m) ? m : '';
    c.passwordHash = isHash(String(raw.passwordHash || '').toLowerCase()) ? raw.passwordHash.toLowerCase() : '';
    return c;
  }

  let config = { ...DEFAULT_CONFIG };
  let configStatus = 'loading'; // 'loading' | 'ok' | 'error'
  async function loadConfig() {
    try {
      const r = await fetch(`${CONFIG_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      config = sanitizeConfig(await r.json());
      configStatus = 'ok';
    } catch { configStatus = 'error'; }
    return config;
  }

  /** PBKDF2-SHA256: nel repository si pubblica solo l'impronta, mai la password. */
  async function hashPassword(pw) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('SecretSantaISD'), iterations: 200000, hash: 'SHA-256' }, base, 256);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  // ============ Date helpers ============
  function fmtDate(iso, withTime = true) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const opts = { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Rome' };
    if (withTime) Object.assign(opts, { hour: '2-digit', minute: '2-digit' });
    try { return new Intl.DateTimeFormat('it-IT', opts).format(d); } catch { return d.toLocaleString(); }
  }

  // ============ Audio (WebAudio sintetizzato, nessun file) ============
  const prefs = Object.assign({ sound: true, music: true }, store.load(PREFS_KEY, {}));
  const sfx = (() => {
    let ctx = null, master = null, reverb = null, noiseBuf = null;
    function init() {
      if (!prefs.sound) return null;
      try {
        if (!ctx) {
          const C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          ctx = new C();
          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14; comp.ratio.value = 6;
          comp.connect(ctx.destination);
          master = ctx.createGain(); master.gain.value = .9; master.connect(comp);
          // Riverbero generato (coda di rumore che decade): dà "aria" a campanelle e brillantini.
          const len = Math.floor(ctx.sampleRate * 2.4);
          const ir = ctx.createBuffer(2, len, ctx.sampleRate);
          for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
          reverb = ctx.createConvolver(); reverb.buffer = ir;
          const rg = ctx.createGain(); rg.gain.value = .32; reverb.connect(rg); rg.connect(comp);
          noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
          const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      } catch { return null; }
    }
    function bus(wet = .25) {
      const g = ctx.createGain(); g.connect(master);
      if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(reverb); }
      return g;
    }
    function env(param, t, a, peak, d) {
      param.setValueAtTime(0.0001, t);
      param.exponentialRampToValueAtTime(peak, t + a);
      param.exponentialRampToValueAtTime(0.0001, t + a + d);
    }
    function tone(type, f, t, d, peak, dest, { a = .005, to = 0 } = {}) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + a + d);
      env(g.gain, t, a, peak, d);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + a + d + .05);
    }
    function noise(t, d, peak, dest, { type = 'bandpass', f = 1000, q = 1, to = 0, a = .003 } = {}) {
      const src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = noiseBuf; src.loop = true;
      fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
      if (to) fl.frequency.exponentialRampToValueAtTime(to, t + a + d);
      env(g.gain, t, a, peak, d);
      src.connect(fl); fl.connect(g); g.connect(dest);
      src.start(t, Math.random() * .5); src.stop(t + a + d + .05);
    }
    function bell(f, t, d, vol, dest) {
      [[1, 1], [2.76, .32], [5.4, .12]].forEach(([m, a]) => tone('sine', f * m, t, d / m ** .3, vol * a, dest, { a: .004 }));
    }
    const play = (fn) => () => { if (init()) fn(ctx.currentTime + .015); };
    const NOTES = { C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, E6: 1318.5, G6: 1568, C7: 2093 };

    return {
      /** Tocco su un pulsante: "pop" morbido. */
      tap: play((t) => { tone('sine', 520, t, .07, .09, bus(.08), { to: 820 }); }),
      /** Selezione di un nome: campanellino di vetro. */
      select: play((t) => { const o = bus(.45); bell(NOTES.E6, t, .9, .09, o); bell(NOTES.G6 * 1.5, t + .07, .7, .05, o); }),
      /** Passaggio del mouse su un nome (solo dispositivi con hover). */
      hover: play((t) => { tone('sine', 1800 + Math.random() * 900, t, .12, .025, bus(.5)); }),
      /** Apertura di una finestra. */
      open: play((t) => { noise(t, .35, .05, bus(.2), { f: 600, to: 2600, q: .8, a: .05 }); bell(NOTES.C6, t + .05, .5, .04, bus(.4)); }),
      /** Chiusura: piccola discesa. */
      close: play((t) => { const o = bus(.4); [NOTES.G6, NOTES.E6, NOTES.C6].forEach((f, i) => bell(f, t + i * .07, .6, .05, o)); }),
      /** Cifra che scorre durante la rivelazione del nome. */
      tick: play((t) => { tone('triangle', 1700 + Math.random() * 500, t, .03, .035, bus(.15)); }),
      error: play((t) => { const o = bus(.05); tone('square', 160, t, .12, .05, o); tone('square', 120, t + .14, .18, .05, o); }),
      unlock: play((t) => { const o = bus(.4); noise(t, .05, .12, o, { f: 3500, q: 2 }); [NOTES.C6, NOTES.E6, NOTES.G6].forEach((f, i) => bell(f, t + .08 + i * .09, 1, .07, o)); }),
      toggleOn: play((t) => { const o = bus(.4); bell(NOTES.G5, t, .8, .08, o); bell(NOTES.C6, t + .1, 1, .08, o); }),
      reset: play((t) => { noise(t, .45, .07, bus(.3), { f: 3000, to: 400, q: .7, a: .03 }); }),

      /** Estrazione: rullo di tamburi che accelera + "riser" + brillantini, per `dur` secondi. */
      drawSequence(dur) {
        if (!init()) return;
        const t0 = ctx.currentTime + .02, o = bus(.18), sp = bus(.5);
        noise(t0, .6, .12, o, { f: 400, to: 3000, q: .7, a: .08 });                     // whoosh iniziale
        tone('sawtooth', 110, t0, dur, .035, o, { a: dur * .8, to: 440 });               // riser
        tone('sine', 55, t0, dur, .12, o, { a: dur * .9, to: 70 });                      // rombo di fondo
        let t = t0 + .1;
        while (t < t0 + dur - .05) {                                                     // rullante sempre più fitto
          const p = (t - t0) / dur;
          noise(t, .07, .05 + p * .14, o, { f: 1800 + p * 1200, q: .9, a: .002 });
          t += .13 - p * .1 + Math.random() * .01;
        }
        for (let i = 0; i < 18; i++) bell(1400 + Math.random() * 2200, t0 + Math.random() * dur, .5, .025, sp);
      },
      /** Fine estrazione: piatto + colpo di grancassa + fanfara. */
      crash: play((t) => {
        const o = bus(.35);
        noise(t, 1.8, .22, o, { type: 'highpass', f: 4500, q: .5 });
        tone('sine', 140, t, .5, .5, bus(0), { to: 40 });
        const brass = bus(.3);
        [[NOTES.C5, 0], [NOTES.E5, .1], [NOTES.G5, .2], [NOTES.C6, .32]].forEach(([f, dt]) => {
          tone('sawtooth', f, t + .1 + dt, dt === .32 ? 1.1 : .16, .05, brass, { a: .02 });
          tone('triangle', f * 2, t + .1 + dt, dt === .32 ? 1.1 : .16, .04, brass, { a: .02 });
        });
        [NOTES.C6, NOTES.E6, NOTES.G6, NOTES.C7].forEach((f, i) => bell(f, t + .45 + i * .06, 1.6, .05, bus(.5)));
      }),

      /** Pacco che trema: fruscii di carta e colpi sordi della scatola. */
      rattle: play((t) => {
        const o = bus(.12);
        for (let i = 0; i < 12; i++) {
          const p = i / 12, at = t + i * .06 + Math.random() * .015;
          noise(at, .05, .05 + p * .1, o, { f: 2200 + Math.random() * 1500, q: 1.2 });
          if (i % 3 === 0) tone('sine', 95 + Math.random() * 20, at, .09, .18 + p * .15, o);
        }
      }),
      /** Coperchio che salta via: "pop" + soffio verso l'alto. */
      pop: play((t) => {
        const o = bus(.3);
        tone('sine', 300, t, .09, .35, o, { to: 1300 });
        noise(t, .03, .2, o, { f: 1500, q: .7 });
        noise(t + .03, .7, .1, o, { f: 500, to: 5000, q: .6, a: .05 });
      }),
      /** Raggi di luce: pioggia di campanelle con molto riverbero. */
      shimmer: play((t) => {
        const o = bus(.7), scale = [NOTES.C6, NOTES.D5 * 2, NOTES.E6, NOTES.G6, NOTES.A5 * 2, NOTES.C7];
        for (let i = 0; i < 16; i++) bell(scale[i % scale.length] * (i > 8 ? 1.5 : 1), t + i * .055, .9, .04, o);
      }),
      /** Nome rivelato: accordo luminoso + carillon. */
      reveal: play((t) => {
        const o = bus(.55);
        [NOTES.C5, NOTES.E5, NOTES.G5].forEach((f) => tone('triangle', f, t, 1.6, .05, o, { a: .03 }));
        [NOTES.G5, NOTES.C6, NOTES.E6, NOTES.G6, NOTES.C7].forEach((f, i) => bell(f, t + i * .09, 2, .08, o));
      }),
      mute() { try { if (ctx && ctx.state === 'running') ctx.suspend(); } catch { /* ignore */ } }
    };
  })();

  // ============ Musica di sottofondo (solo pagina pubblica) ============
  const music = (() => {
    const VOLUME = .55;
    let el = null, src = '', fadeT = 0, hinted = false;
    let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'blocked' | 'error'
    function ensure() {
      if (!config.musica) return null;
      if (el && src === config.musica) return el;
      if (el) el.pause();
      src = config.musica;
      el = new Audio();
      el.loop = true; el.preload = 'auto'; el.volume = 0;
      el.addEventListener('error', () => { state = 'error'; renderMusicBtn(); });
      el.src = /^https:/i.test(src) ? src : encodeURI(src);
      return el;
    }
    function fade(to, ms, done) {
      clearInterval(fadeT);
      const from = el.volume, steps = Math.max(1, Math.round(ms / 50));
      let i = 0;
      fadeT = setInterval(() => {
        i++;
        el.volume = Math.min(1, Math.max(0, from + (to - from) * (i / steps)));
        if (i >= steps) { clearInterval(fadeT); if (done) done(); }
      }, 50);
    }
    const wanted = () => prefs.music && view === 'home' && !document.hidden && !!config.musica;
    async function play() {
      const a = ensure();
      if (!a || state === 'error') return;
      state = 'playing'; // evita doppie partenze mentre play() è in corso
      renderMusicBtn();
      try {
        await a.play();
        if (!wanted()) { a.pause(); state = 'paused'; renderMusicBtn(); return; }
        fade(VOLUME, 1800);
      } catch (e) {
        if (state === 'error') return;
        state = e && e.name === 'NotAllowedError' ? 'blocked' : 'error';
        renderMusicBtn();
        if (state === 'blocked' && !hinted) { hinted = true; toast('🎵 Tocca lo schermo per la musica'); }
      }
    }
    function pause() {
      if (!el || state !== 'playing') { if (state === 'blocked') state = 'paused'; renderMusicBtn(); return; }
      state = 'paused';
      fade(0, 600, () => { if (state !== 'playing') el.pause(); });
      renderMusicBtn();
    }
    /** Allinea la riproduzione allo stato voluto (pagina, preferenza, scheda visibile). */
    function sync() {
      if (wanted()) { if (state !== 'playing' && state !== 'error' && state !== 'blocked') play(); }
      else if (state === 'playing' || state === 'blocked') pause();
    }
    /** Primo gesto dell'utente: sblocca la riproduzione se il browser l'aveva bloccata. */
    function unlock() { if (state === 'blocked' && wanted()) { state = 'idle'; play(); } }
    return { sync, unlock, get state() { return state; } };
  })();

  // ============ Sky (stelle + neve) ============
  function initSky() {
    const c = $('#sky'), ctx = c.getContext('2d');
    let w = 0, h = 0, flakes = [], stars = [], raf = 0, last = 0;
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const area = w * h;
      const nf = reduceMotion ? 30 : Math.max(50, Math.min(200, Math.round(area / 9000)));
      flakes = Array.from({ length: nf }, () => mkFlake(true));
      stars = Array.from({ length: Math.round(area / 7000) }, () => ({
        x: Math.random() * w, y: Math.random() * h * .75, r: Math.random() * 1.3 + .2,
        sp: .0008 + Math.random() * .002, ph: Math.random() * 6.28
      }));
    }
    function mkFlake(anywhere) {
      const z = Math.random();
      return {
        x: Math.random() * w, y: anywhere ? Math.random() * h : -10,
        r: .8 + z * 2.8, vy: 18 + z * 55, sw: .4 + Math.random() * 1.2, ph: Math.random() * 6.28,
        amp: 10 + Math.random() * 25, a: .35 + z * .6
      };
    }
    function frame(t) {
      const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#fff';
      for (const s of stars) {
        ctx.globalAlpha = .25 + .75 * Math.abs(Math.sin(t * s.sp + s.ph));
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      }
      for (const f of flakes) {
        f.y += f.vy * dt;
        const x = f.x + Math.sin(t * .001 * f.sw + f.ph) * f.amp;
        if (f.y > h + 10) Object.assign(f, mkFlake(false));
        ctx.globalAlpha = f.a;
        ctx.beginPath(); ctx.arc(x, f.y, f.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(frame);
    }
    let rt;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(raf);
      if (!document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
    });
    resize();
    raf = requestAnimationFrame(frame);
  }

  // ============ Confetti ============
  const fx = (() => {
    const c = $('#fx'), ctx = c.getContext('2d');
    let parts = [], raf = 0, w = 0, h = 0;
    const palette = ['#ffd77a', '#ff6075', '#4be3ad', '#ffffff', '#78b5ff', '#f5a623'];
    function size() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', size); size();
    function add(x, y, vx, vy) {
      parts.push({
        x, y, vx, vy, w: 6 + Math.random() * 6, h: 9 + Math.random() * 9, rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * .35, color: palette[(Math.random() * palette.length) | 0],
        circle: Math.random() < .25, wob: Math.random() * 6.28
      });
    }
    function loop() {
      ctx.clearRect(0, 0, w, h);
      parts = parts.filter((p) => p.y < h + 40 && p.x > -60 && p.x < w + 60);
      for (const p of parts) {
        p.vx *= .985; p.vy = Math.min(p.vy + .32, 9); p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.wob += .12;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        if (p.circle) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.283); ctx.fill(); }
        else ctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.wob)), p.w, p.h * Math.abs(Math.cos(p.wob)) + 1);
        ctx.restore();
      }
      if (parts.length) raf = requestAnimationFrame(loop); else { raf = 0; ctx.clearRect(0, 0, w, h); }
    }
    function start() { if (!raf) raf = requestAnimationFrame(loop); }
    return {
      burst(x, y, n = 160) {
        if (reduceMotion) n = Math.min(n, 40);
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 12;
          add(x, y, Math.cos(a) * s, Math.sin(a) * s - 6);
        }
        start();
      },
      rain(n = 180) {
        if (reduceMotion) n = Math.min(n, 40);
        for (let i = 0; i < n; i++) add(Math.random() * w, -20 - Math.random() * h * .5, (Math.random() - .5) * 3, 2 + Math.random() * 4);
        start();
      }
    };
  })();

  function scramble(el, target, duration = 1200) {
    return new Promise((resolve) => {
      const pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ★✦❄';
      const chars = [...target];
      if (reduceMotion) { el.textContent = target; resolve(); return; }
      const t0 = performance.now();
      let lastTick = 0;
      function step(t) {
        const p = Math.min(1, (t - t0) / duration);
        const done = Math.floor(p * chars.length);
        el.textContent = chars.map((ch, i) => (i < done || ch === ' ') ? ch : pool[(Math.random() * pool.length) | 0]).join('');
        if (t - lastTick > 90) { sfx.tick(); lastTick = t; }
        if (p < 1) requestAnimationFrame(step); else { el.textContent = target; resolve(); }
      }
      requestAnimationFrame(step);
    });
  }

  function sanitizeDraw(d) {
    if (!d || typeof d !== 'object' || !d.assignments) return null;
    const names = Object.keys(d.assignments);
    if (names.length < 2 || !isValidAssignment(d.assignments, names)) return null;
    // Oggetti senza prototipo: un nome come "__proto__" o "constructor" resta un dato qualsiasi.
    const assignments = Object.create(null), revealed = Object.create(null);
    names.forEach((n) => { assignments[n] = d.assignments[n]; });
    if (d.revealed && typeof d.revealed === 'object') names.forEach((n) => { if (Object.hasOwn(d.revealed, n) && d.revealed[n] === true) revealed[n] = true; });
    return { assignments, revealed, roster: typeof d.roster === 'string' ? d.roster : '', drawnAt: Number(d.drawnAt) || 0 };

  async function doDraw() {
    if (org.busy) return;
    if (org.draw) {
      const ok = await confirmDialog({
        emoji: '🔁', title: 'Rifare l\'estrazione?',
        text: 'Gli abbinamenti attuali verranno sostituiti e chi ha già scoperto dovrà scoprire di nuovo.',

    if (blocked.length) { toast(`${blocked.join(', ')}: nessuno da estrarre, gruppo troppo grande`, true); return; }
    const res = computeDraw(names, exclusions);
    if (!res) { toast('Impossibile estrarre con questi gruppi. Riduci le esclusioni.', true); return; }
    org.busy = true;
    try {
      await playDrawAnimation(shuffle(names));
      org.draw = { assignments: res, revealed: Object.create(null), roster: rosterSig(names), drawnAt: Date.now() };
      saveDraw();
      fx.rain(220);
      toast('Estrazione completata! 🎉');
    } finally { org.busy = false; render(); }
  }

  async function revealFor(name) {
    const d = org.draw;
    if (!d || !Object.hasOwn(d.assignments, name)) return;
    const santa = d.assignments[name];
    const seen = isSeen(d, name);
    if (seen) {
      const ok = await confirmDialog({
        emoji: '👀', title: `${name} ha già scoperto`,
        text: 'Vuoi rivederlo? Assicurati che sia proprio questa persona a guardare.', ok: 'Rivedi'
      });
      if (!ok) return;
    }
    openGift({
      person: name, santa, confirm: !seen,
      onOpened: () => { d.revealed[name] = true; saveDraw(); },
      onClose: (opened) => { if (opened) render(); }
    });
  }

  async function resetSeen() {
    const ok = await confirmDialog({ emoji: '🔄', title: 'Azzerare i "già scoperto"?', text: 'Tutti torneranno nello stato "da scoprire". Gli abbinamenti non cambiano.', ok: 'Azzera' });
    if (ok) { sfx.reset(); org.draw.revealed = Object.create(null); saveDraw(); render(); }
  }

  // ============ Views ============
  function countdownHtml(targetIso, doneText) {
    return `<div class="cd-wrap" data-cd="${esc(targetIso)}">
      <div class="countdown" role="timer" aria-label="Conto alla rovescia">
        <div class="cd-tile"><b data-cd-d>--</b><small>giorni</small></div>
        <div class="cd-tile"><b data-cd-h>--</b><small>ore</small></div>
        <div class="cd-tile"><b data-cd-m>--</b><small>minuti</small></div>
        <div class="cd-tile"><b data-cd-s>--</b><small>secondi</small></div>
      </div>
      <div class="cd-done">${doneText}</div>
    </div>`;
  }

  function viewHome() {
    return `<section class="hero">
      <p class="eyebrow">✨ ${esc(config.titolo)} ✨</p>
      <h1 class="title"><span class="shine">Secret Santa</span></h1>
      <p class="subtitle">Ci vediamo <strong>${esc(fmtDate(config.dataEvento))}</strong></p>
      <div class="hero-gift"><div class="gift bob" style="--g:min(210px,52vw)" aria-hidden="true">${giftInner()}</div></div>
      ${countdownHtml(config.dataEvento, '🎄 È arrivato il giorno! Buon pranzo! 🎄')}
      <p class="note-card">🎁 L'estrazione si farà <strong>dal vivo al pranzo</strong>: scoprirai lì chi ti farà il regalo.${config.budget ? ` Budget: <strong>${esc(config.budget)}</strong>.` : ''}</p>
    </section>`;
  }

  function viewLogin() {
    if (configStatus === 'loading') return '<div class="card login"><p class="hint">Caricamento…</p></div>';
    if (!config.passwordHash) {
      return `<div class="card login">
        <div class="emoji" aria-hidden="true">🛠️</div>
        <h3 style="justify-content:center">Imposta la password</h3>
        <p class="hint">${configStatus === 'error' ? 'Impossibile leggere config.json. ' : ''}Nessuna password impostata. Scegline una: ti preparo il valore da incollare in <strong>config.json</strong> alla voce <strong>passwordHash</strong>.</p>
        <form data-form="setup" autocomplete="off">
          <input class="input" type="password" name="pw" placeholder="Nuova password" aria-label="Nuova password" minlength="6" required autocomplete="new-password">
          <button class="btn primary" type="submit">Genera impronta</button>
        </form>
        ${org.setupHash ? `<code class="hash">"passwordHash": "${esc(org.setupHash)}"</code>
          <div class="row" style="justify-content:center;margin-top:12px"><button class="btn small" data-action="copy-hash">📋 Copia</button></div>
          <p class="hint" style="margin-top:12px">Fai commit di config.json, attendi la pubblicazione e ricarica questa pagina.</p>` : ''}
      </div>`;
    }
    return `<div class="card login ${org.loginError ? 'err' : ''}">
      <div class="emoji" aria-hidden="true">🔐</div>
      <h3 style="justify-content:center">Area organizzatore</h3>
      <p class="hint">Inserisci la password per gestire l'estrazione.</p>
      <form data-form="login" autocomplete="off">
        <input id="pwInput" class="input" type="password" name="pw" placeholder="Password" aria-label="Password" required autocomplete="current-password">
        <button class="btn primary" type="submit">Entra</button>
      </form>
    </div>`;
  }

  function viewParticipants() {
    const { csv } = org;
    const n = csv.people.length;
    const groupsColor = new Map();
    csv.people.forEach((p) => { if (p.group && !groupsColor.has(nameKey(p.group))) groupsColor.set(nameKey(p.group), COLORS[groupsColor.size % COLORS.length]); });
    const chips = csv.status === 'loading' ? '<div class="empty">Caricamento…</div>'
      : n ? `<div class="chips">${csv.people.map((p) => {
        const col = p.group ? groupsColor.get(nameKey(p.group)) : 'rgba(255,255,255,.35)';
        return `<span class="chip"><i class="dot" style="background:${col};color:${col}"></i><span>${esc(p.name)}</span>${p.group ? `<span class="grp">${esc(p.group)}</span>` : ''}</span>`;
      }).join('')}</div>`
      : '<div class="empty">Nessun partecipante caricato.</div>';
    const errs = csv.errors.length ? `<ul class="errs">${csv.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>` : '';
    return `<h2 class="section">Pronti per l'estrazione?</h2>
      <p class="lead">I partecipanti arrivano da <strong>partecipanti.csv</strong>. Stesso <em>gruppo</em> = non si estraggono a vicenda.</p>
      <div class="card">
        <h3>👥 Partecipanti <span class="count-pill">${n}</span></h3>
        <div class="row" style="margin-top:10px"><button class="btn small" data-action="reload-csv">🔄 Ricarica il CSV</button></div>
        ${chips}
        ${errs}
      </div>
      <div class="actions-foot" style="flex-direction:column;align-items:center">
        <button class="btn red big" data-action="draw" ${n >= MIN_PEOPLE && !org.busy ? '' : 'disabled'}>🎲 Estrai i nomi!</button>
        ${n >= MIN_PEOPLE ? '' : `<span class="hint">Servono almeno ${MIN_PEOPLE} partecipanti</span>`}
        <button class="btn small" data-action="logout">🚪 Esci</button>
      </div>`;
  }

  function viewReveal() {
    const d = org.draw;
    const names = drawNames(d);
    const seen = names.filter((n) => isSeen(d, n)).length;
    const pct = Math.round((seen / names.length) * 100);
    const rosterChanged = org.csv.status === 'ok' && d.roster && rosterSig(org.csv.people.map((p) => p.name)) !== d.roster;
    return `<h2 class="section">Chi sta scoprendo?</h2>
      <p class="lead">Tocca il tuo nome per aprire il pacco. Gli altri… girino lo sguardo! 👀</p>
      ${rosterChanged ? '<div class="banner"><span aria-hidden="true">⚠️</span><span>Il CSV dei partecipanti è cambiato dopo l\'estrazione: valuta di rifarla.</span></div>' : ''}
      <div class="progress"><div class="bar"><i style="width:${pct}%"></i></div><b>${seen}/${names.length}</b></div>
      <div class="orn-grid">
        ${names.map((n, i) => {
          const s = isSeen(d, n);
          return `<button class="orn c${(i % 6) + 1} ${s ? 'seen' : ''}" style="--i:${i}" data-action="reveal" data-i="${i}" aria-label="${esc(n)}${s ? ', già scoperto' : ''}">
            <span class="bauble" aria-hidden="true"></span>
            <span class="orn-name">${esc(n)}</span>
            <span class="orn-state">${s ? '✓ Già scoperto' : 'Tocca per scoprire'}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="actions-foot">
        <button class="btn small" data-action="reset-seen">🔄 Azzera "già scoperto"</button>
        <button class="btn small danger" data-action="draw">🔁 Rifai estrazione</button>
        <button class="btn small" data-action="logout">🚪 Esci</button>
      </div>`;
  }

  function render() {
    const app = $('#app');
    document.body.dataset.view = view;
    app.innerHTML = view !== 'admin' ? viewHome() : !org.authed ? viewLogin() : org.draw ? viewReveal() : viewParticipants();
    $('.brand').disabled = view !== 'admin';
    renderSoundBtn();
    renderMusicBtn();
    updateCountdown();
    if (view === 'admin' && !org.authed) $('#pwInput')?.focus({ preventScroll: true });
  }

  function renderMusicBtn() {
    const b = $('#musicBtn');
    const on = prefs.music && music.state !== 'paused';
    b.hidden = view !== 'home' || !config.musica || music.state === 'error';
    b.textContent = on ? '🎵' : '🔇';
    b.setAttribute('aria-pressed', String(on));
    b.title = music.state === 'blocked' ? 'Tocca per avviare la musica' : on ? 'Metti in pausa la musica' : 'Riattiva la musica';
    b.classList.toggle('pulse', music.state === 'blocked' && prefs.music);
  }

  function renderSoundBtn() {
    const b = $('#soundBtn');
    b.hidden = view !== 'admin';
    b.textContent = prefs.sound ? '🔔' : '🔕';
    b.setAttribute('aria-pressed', String(prefs.sound));
    b.title = prefs.sound ? 'Suoni attivi' : 'Suoni disattivati';
  }

  function updateCountdown() {
    const wrap = document.querySelector('[data-cd]');
    if (!wrap) return;
    const diff = new Date(wrap.dataset.cd) - Date.now();
    wrap.classList.toggle('done', !(diff > 0));
    if (!(diff > 0)) return;
    const s = Math.floor(diff / 1000);
    const set = (k, v) => { const el = wrap.querySelector(`[data-cd-${k}]`); if (el && el.textContent !== v) el.textContent = v; };
    set('d', String(Math.floor(s / 86400)));
    set('h', String(Math.floor((s % 86400) / 3600)).padStart(2, '0'));
    set('m', String(Math.floor((s % 3600) / 60)).padStart(2, '0'));
    set('s', String(s % 60).padStart(2, '0'));
  }

  // ============ Events ============
  const app = $('#app');
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled || b.closest('.overlay')) return;
    const own = ['sound', 'draw', 'reveal', 'music'];
    if (!own.includes(b.dataset.action)) sfx.tap();
    switch (b.dataset.action) {
      case 'home': location.hash = ''; break;
      case 'music':
        prefs.music = music.state === 'blocked' ? true : !(prefs.music && music.state !== 'paused');
        store.save(PREFS_KEY, prefs);
        if (prefs.music) { if (music.state === 'blocked') music.unlock(); else music.sync(); } else music.sync();
        renderMusicBtn();
        break;
      case 'sound': prefs.sound = !prefs.sound; store.save(PREFS_KEY, prefs); renderSoundBtn(); if (prefs.sound) sfx.toggleOn(); else sfx.mute(); break;
      case 'reload-csv': loadCSV(); break;
      case 'draw': sfx.tap(); doDraw(); break;
      case 'reveal': sfx.select(); if (org.draw) revealFor(drawNames(org.draw)[Number(b.dataset.i)]); break;
      case 'reset-seen': resetSeen(); break;
      case 'logout': logout(); break;
      case 'copy-hash': copyText(`"passwordHash": "${org.setupHash}"`).then((ok) => toast(ok ? 'Copiato 📋' : 'Copia non riuscita', !ok)); break;
    }
  });

  // Tintinnio leggero passando sopra i nomi (solo con mouse), limitato per non diventare fastidioso.
  if (matchMedia('(hover: hover)').matches) {
    let lastHover = 0, lastOrn = null;
    app.addEventListener('pointerover', (e) => {
      const o = e.target.closest('.orn');
      if (!o || o === lastOrn) return;
      lastOrn = o;
      const now = performance.now();
      if (now - lastHover > 120) { lastHover = now; sfx.hover(); }
    });
    app.addEventListener('pointerout', (e) => { if (!e.relatedTarget?.closest?.('.orn')) lastOrn = null; });
  }

  app.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const input = f.elements.namedItem('pw');
    const pw = input?.value || '';
    const btn = f.querySelector('button[type=submit]');
    if (btn) btn.disabled = true;
    try {
      if (f.dataset.form === 'login') await login(pw);
      else if (f.dataset.form === 'setup' && pw.length >= 6) { sfx.tap(); org.setupHash = await hashPassword(pw); render(); }
    } catch {
      toast('Il browser non supporta la crittografia necessaria (serve HTTPS).', true);
    } finally { if (btn && document.contains(btn)) btn.disabled = false; }
  });

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      } catch { return false; }
    }
  }

  addEventListener('hashchange', () => {
    closeOverlayNow();
    readHash();
    org.loginError = false;
    render();
    if (view === 'admin' && org.authed && org.csv.status === 'idle') loadCSV();
    music.sync();
    scrollTo({ top: 0 });
  });

  // Il browser consente l'audio solo dopo un gesto: al primo tocco/tasto la musica parte se era bloccata.
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach((t) => document.addEventListener(t, (e) => {
    if (e.target.closest && e.target.closest('#musicBtn')) return; // gestito dal pulsante stesso
    music.unlock();
  }, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => music.sync());

  // ============ Boot ============
  readHash();
  initSky();
  render();
  loadConfig().then(() => {
    checkSession();
    render();
    if (view === 'admin' && org.authed) loadCSV();
    music.sync();
  });
  setInterval(updateCountdown, 1000);

  // Esposto solo per i test automatici
  window.__ss = { computeDraw, blockedGivers, isValidAssignment, participantsFromCSV, exclusionsFromGroups, sanitizeConfig, hashPassword, sfx, music };
})();
</script>
</body>
</html>
